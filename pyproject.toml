[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-ask"
dynamic = ["version"]
description = "Answer questions about a codebase with cited file:line ranges"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Iamsohungrynow" }]
keywords = ["code search", "question answering", "rag", "tree-sitter", "bm25", "claude", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "anthropic>=1.0",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/iamsohungrynow/repo-ask"
Issues = "https://github.com/iamsohungrynow/repo-ask/issues"

[project.scripts]
repo-ask = "repo_ask.cli:main"

[tool.setuptools]
packages = ["repo_ask"]

[tool.setuptools.dynamic]
version = { attr = "repo_ask.__version__" }
