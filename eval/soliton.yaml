# Evaluation set for https://github.com/iamsohungrynow/Soliton at commit 9f01a58.
# Line ranges were read from that commit by hand. Each range was then checked against the code:
# it answers its question, and it starts and ends on the definition it names.
#
# An answer counts as correct if one of its validated citations is in an expected file and
# overlaps that file's expected line range. `expected` lists every location that is a correct
# answer. Entries marked "also" are second correct locations, added before any run.
#
# Questions 1-5 are the seed questions from the brief; 6-20 were drafted by reading the repo.
# u1-u3 have no answer in the repo: the tool must reply "Not found in this repo".

